[workspace]
resolver = "2"
members = ["crates/shotty-capture", "crates/shotty-annotate", "crates/shotty-media", "crates/shotty-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shotty-capture = { path = "crates/shotty-capture" }
shotty-annotate = { path = "crates/shotty-annotate" }
shotty-media = { path = "crates/shotty-media" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
